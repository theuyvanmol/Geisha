<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap');

/* ============ TOKENS ============ */
:root{
  --ink:#08080b;
  --panel:#131316;
  --panel-2:#1a1a1f;
  --hair: rgba(255,255,255,0.12);
  --gold:#d4af37;
  --gold-bright:#f4cf6b;
  --vermilion:#c81e3a;
  --vermilion-bright:#e83a52;
  --ivory:#f5f1e8;
  --muted:#a3a0a0;
  --sakura:#ef3c5c;
  --sakura-2:#ff7a94;
  --sakura-glow: rgba(239,60,92,0.4);
  --shadow: 0 30px 80px rgba(0,0,0,0.6);
  --ease: cubic-bezier(.22,.9,.3,1);
  --display: 'Shippori Mincho', serif;
  --body-f: 'Jost', sans-serif;
}

body.fusion, #view-fusion{
  --ink:#0a0d0b;
  --panel:#101a15;
  --panel-2:#16241d;
  --hair: rgba(201,138,75,0.18);
  --gold:#c98a4b;
  --gold-bright:#e8ab6b;
  --vermilion:#3f6f66;
  --vermilion-bright:#5a9184;
  --ivory:#f2ece0;
  --muted:#9fb0a8;
}

*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  *,*::before,*::after{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important; }
}
body{
  margin:0;
  background:var(--ink);
  color:var(--ivory);
  font-family:var(--body-f);
  font-weight:300;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{ max-width:100%; display:block; }
a{ color:inherit; text-decoration:none; }
h1,h2,h3,h4{ font-family:var(--display); font-weight:600; margin:0; letter-spacing:.01em; }
p{ margin:0; }
ul{ margin:0; padding:0; list-style:none; }
button{ font-family:inherit; cursor:pointer; }
::selection{ background:var(--gold); color:var(--ink); }

:focus-visible{
  outline:2px solid var(--gold-bright);
  outline-offset:3px;
}

.container{ max-width:1240px; margin:0 auto; padding:0 32px; }
.eyebrow{
  font-family:var(--body-f);
  text-transform:uppercase;
  letter-spacing:.32em;
  font-size:.72rem;
  color:var(--gold);
  display:flex;
  align-items:center;
  gap:14px;
}
.eyebrow::before{ content:''; width:34px; height:1px; background:var(--gold); display:inline-block; }

.btn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  border:1px solid var(--sakura);
  color:var(--ivory);
  background:transparent;
  padding:15px 30px;
  font-size:.72rem;
  letter-spacing:.24em;
  text-transform:uppercase;
  position:relative;
  overflow:hidden;
  transition:color .5s var(--ease), box-shadow .4s var(--ease);
  z-index:0;
}
.btn::before{
  content:'';
  position:absolute; inset:0;
  background:linear-gradient(120deg, var(--sakura), var(--sakura-2));
  transform:translateX(-101%);
  transition:transform .5s var(--ease);
  z-index:-1;
}
.btn:hover, .btn:focus-visible{ color:#fff; box-shadow:0 10px 30px var(--sakura-glow); }
.btn:hover::before, .btn:focus-visible::before{ transform:translateX(0); }
.btn-solid{
  background:linear-gradient(120deg, var(--sakura), var(--sakura-2));
  color:#fff; border-color:transparent;
  box-shadow:0 10px 30px var(--sakura-glow);
}
.btn-solid::before{ background:linear-gradient(120deg, var(--sakura-2), var(--sakura)); }
.btn-solid:hover{ color:#fff; }
.btn svg{ width:14px; height:14px; transition:transform .4s var(--ease); }
.btn:hover svg{ transform:translateX(4px); }

/* ============ NAV ============ */
.site-nav{
  position:fixed; top:0; left:0; right:0; z-index:200;
  display:flex; align-items:center; justify-content:space-between;
  padding:26px 40px;
  transition:padding .4s var(--ease), background .4s var(--ease), box-shadow .4s var(--ease);
}
.site-nav.scrolled{
  padding:14px 40px;
  background:rgba(10,9,8,0.88);
  backdrop-filter: blur(14px);
  box-shadow:0 12px 40px rgba(0,0,0,.4);
  border-bottom:1px solid var(--hair);
}
.nav-logo{ display:flex; align-items:center; gap:12px; }
.nav-logo img{ height:38px; width:auto; display:block; }
.nav-logo .mark{ font-family:var(--display); font-size:1.05rem; letter-spacing:.34em; text-transform:uppercase; }
.nav-logo .sub{ display:block; font-size:.55rem; letter-spacing:.4em; color:var(--gold); text-transform:uppercase; margin-top:2px; }
.nav-links{ display:flex; gap:40px; align-items:center; }
.nav-links a{
  font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:var(--muted);
  position:relative; padding-bottom:6px; transition:color .3s;
}
.nav-links a::after{
  content:''; position:absolute; left:0; bottom:0; width:0; height:1px; background:var(--gold);
  transition:width .35s var(--ease);
}
.nav-links a:hover, .nav-links a.active{ color:var(--ivory); }
.nav-links a:hover::after, .nav-links a.active::after{ width:100%; }
.nav-cta{ display:flex; align-items:center; gap:24px; }
.nav-burger{
  display:none; flex-direction:column; gap:5px; background:none; border:none; padding:8px;
}
.nav-burger span{ width:22px; height:1px; background:var(--ivory); display:block; }

.mobile-panel{
  position:fixed; inset:0; z-index:199; background:var(--ink);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px;
  transform:translateY(-100%); transition:transform .5s var(--ease);
}
.mobile-panel.open{ transform:translateY(0); }
.mobile-panel a{ font-family:var(--display); font-size:1.4rem; letter-spacing:.08em; text-transform:uppercase; }

/* ============ HERO ============ */
.hero{
  position:relative; min-height:100vh; display:flex; align-items:center; justify-content:flex-start;
  overflow:hidden; padding:140px 24px 110px; text-align:left;
}
.hero-bg{
  position:absolute; inset:0; z-index:0;
}
.hero-bg img{
  width:100%; height:100%; object-fit:cover; object-position:70% 28%;
}
.hero-bg::after{
  content:''; position:absolute; inset:0;
  background:
    linear-gradient(90deg, var(--ink) 0%, rgba(10,9,8,.86) 24%, rgba(10,9,8,.4) 48%, rgba(10,9,8,.05) 68%, transparent 82%),
    linear-gradient(0deg, rgba(10,9,8,.55) 0%, transparent 22%, transparent 78%, rgba(10,9,8,.6) 100%);
}
.hero-inner{ position:relative; z-index:2; width:100%; }
.hero-copy{ max-width:600px; margin:0; display:flex; flex-direction:column; align-items:flex-start; text-align:left; }
.hero-logo{ max-width:300px; width:46%; margin:0 0 28px; filter:drop-shadow(0 12px 34px rgba(0,0,0,.55)); }
.hero-copy h1{
  font-size:clamp(2.6rem, 6.4vw, 4.6rem); line-height:1.02; margin:20px 0 24px;
  color:var(--ivory);
}
.hero-copy h1 span{ color:var(--sakura-2); display:block; }
.hero-copy p{ color:var(--muted); font-size:1.05rem; max-width:460px; margin:0 0 38px; }
.hero-actions{ display:flex; gap:18px; flex-wrap:wrap; justify-content:flex-start; }

.scroll-cue{
  position:absolute; bottom:30px; left:50%; transform:translateX(-50%); z-index:2;
  display:flex; flex-direction:column; align-items:center; gap:10px; color:var(--muted); font-size:.65rem; letter-spacing:.3em; text-transform:uppercase;
}
.scroll-cue .stick{ width:1px; height:36px; background:var(--hair); position:relative; overflow:hidden; }
.scroll-cue .stick::after{ content:''; position:absolute; top:-40%; left:0; width:100%; height:40%; background:var(--sakura-2); animation:dropdown 2.2s ease-in-out infinite; }
@keyframes dropdown{ 0%{ top:-40%; } 60%{ top:100%; } 100%{ top:100%; } }
@media (max-width:600px){
  .hero{ padding:120px 20px 90px; }
  .hero-logo{ width:72%; max-width:220px; margin-bottom:22px; }
  .scroll-cue{ display:none; }
}

.hero-bg.abstract{
  background:
    radial-gradient(circle at 78% 20%, rgba(201,138,75,.5), transparent 55%),
    radial-gradient(circle at 25% 80%, rgba(90,145,132,.45), transparent 50%),
    var(--ink);
}
.hero-bg.abstract svg{ position:absolute; inset:0; width:100%; height:100%; opacity:.55; }
.hero-bg.abstract::after{ background:linear-gradient(90deg, var(--ink) 4%, rgba(10,13,11,.55) 45%, rgba(10,13,11,.15) 75%); }

.about-media.abstract .frame{ height:520px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
.about-media.abstract .frame svg{ width:100%; height:100%; position:absolute; inset:0; }

.reserve-bg.abstract{
  background:
    radial-gradient(circle at 30% 30%, rgba(201,138,75,.35), transparent 55%),
    radial-gradient(circle at 75% 70%, rgba(90,145,132,.35), transparent 55%),
    var(--ink);
}

/* petal canvas overlay */
#petal-canvas{ position:fixed; inset:0; pointer-events:none; z-index:150; }

/* ============ SECTION GENERIC ============ */
section{ position:relative; padding:130px 0; }
.section-head{ max-width:640px; margin-bottom:60px; }
.section-head .eyebrow{ margin-bottom:20px; }
.section-head h2{ font-size:clamp(2.1rem,4vw,3.2rem); line-height:1.08; }
.section-head p.lead{ margin-top:22px; color:var(--muted); font-size:1.02rem; max-width:520px; }
.reveal{ opacity:0; transform:translateY(36px); transition:opacity .9s var(--ease), transform .9s var(--ease); }
.reveal.in{ opacity:1; transform:translateY(0); }

/* ============ ABOUT ============ */
.about{ background:var(--panel); }
.about-grid{ display:grid; grid-template-columns:1fr 1fr; gap:70px; align-items:center; }
.about-media{ position:relative; }
.about-media .frame{
  position:relative; border:1px solid var(--hair); padding:18px;
}
.about-media img{ width:100%; height:520px; object-fit:cover; }
.about-media .tag{
  position:absolute; bottom:-26px; left:-26px; background:var(--gold); color:var(--ink);
  padding:20px 26px; font-family:var(--display); font-size:.85rem; letter-spacing:.06em;
  max-width:220px; box-shadow:var(--shadow);
}
.about-copy p{ color:var(--muted); margin-bottom:20px; font-size:1.02rem; }
.about-copy p:first-of-type{ color:var(--ivory); font-size:1.15rem; }
.stat-row{ display:flex; gap:50px; margin-top:40px; }
.stat-row div b{ font-family:var(--display); font-size:2rem; color:var(--gold); display:block; }
.stat-row div span{ font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }

/* ============ SPECIALS IMMERSIVE BANNER ============ */
.specials{ background:var(--ink); padding:0; }
.specials-slider{ position:relative; width:100%; aspect-ratio:2.1/1; min-height:340px; max-height:560px; overflow:hidden; background:#08080b; }
.special-slide{
  position:absolute; inset:0; opacity:0; visibility:hidden;
  transition:opacity 1.1s var(--ease);
  display:flex; align-items:flex-end;
}
.special-slide.active{ opacity:1; visibility:visible; }
.special-slide .slide-bg{
  position:absolute; inset:0;
  transform:scale(1.08); transition:transform 9s linear;
}
.special-slide.active .slide-bg{ transform:scale(1); }
.special-slide.slide-photo .slide-bg{ transform:none; transition:none; background:#0a0908; }
.special-slide .slide-bg svg{ position:absolute; inset:0; width:100%; height:100%; opacity:.5; }
.special-slide .slide-bg img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; }
.special-slide.slide-plain .slide-bg img{ object-fit:contain; object-position:center; }
.special-slide::before{
  content:''; position:absolute; inset:0;
  background:linear-gradient(0deg, rgba(10,9,8,.92) 6%, rgba(10,9,8,.35) 55%, rgba(10,9,8,.55) 100%);
}
.special-slide.slide-plain::before{
  background:linear-gradient(0deg, rgba(10,9,8,.7) 0%, transparent 26%);
}
.special-copy{ position:relative; z-index:2; padding:70px 0; width:100%; }
.special-copy .eyebrow{ color:var(--gold-bright); }
.special-copy h3{ font-size:clamp(2rem,4.4vw,3.4rem); margin:16px 0 14px; }
.special-copy p{ color:var(--muted); max-width:480px; margin-bottom:26px; }
.specials-nav{
  position:absolute; z-index:3; bottom:36px; right:40px; display:flex; gap:12px;
}
.specials-nav button{
  width:46px; height:46px; border:1px solid var(--hair); background:rgba(10,9,8,.5); color:var(--ivory);
  display:flex; align-items:center; justify-content:center; transition:.3s;
}
.specials-nav button:hover{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
.specials-tabs{
  position:absolute; z-index:3; left:40px; bottom:36px; display:flex; gap:10px;
}
.specials-tabs button{
  border:none; background:var(--hair); width:34px; height:3px; padding:0; position:relative; overflow:hidden;
}
.specials-tabs button.active{ background:var(--gold); }
.specials-tabs button svg{ width:14px; height:14px; }

/* ============ MENU ============ */
.menu{ background:var(--panel-2); }
.menu-grid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--hair);
  border:1px solid var(--hair);
}
.menu-card{
  background:var(--panel); position:relative; aspect-ratio:4/5; overflow:hidden;
  display:flex; align-items:flex-end;
}
.menu-card .card-icon{
  position:absolute; top:38px; right:30px; width:46px; height:46px; z-index:2;
  opacity:.7; transition:transform .6s var(--ease), opacity .4s;
}
.menu-card .card-icon svg{ width:100%; height:100%; stroke:var(--gold); fill:none; stroke-width:1.1; }
.menu-card:hover .card-icon{ transform:translateY(-6px) rotate(-4deg); opacity:1; }
.menu-card .card-bg{
  position:absolute; inset:0;
  background:
    radial-gradient(circle at 20% 120%, var(--vermilion) 0%, transparent 55%),
    radial-gradient(circle at 90% -10%, var(--gold) 0%, transparent 45%),
    var(--panel);
  opacity:.28;
  transform:scale(1.05);
  transition:transform .8s var(--ease), opacity .5s var(--ease);
}
.menu-card:hover .card-bg{ transform:scale(1.14); opacity:.5; }
.menu-card .card-bg img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.menu-card .card-bg.has-photo{ opacity:1; background:none; }
.menu-card:hover .card-bg.has-photo{ opacity:1; }
.menu-card::before{
  content:''; position:absolute; inset:0; background:linear-gradient(0deg, rgba(10,9,8,.92), rgba(10,9,8,.05) 65%);
  z-index:1;
}
.menu-card-copy{ position:relative; z-index:2; padding:30px; width:100%; }
.menu-card-copy .num{ font-size:.7rem; letter-spacing:.2em; color:var(--gold); }
.menu-card-copy h4{ font-size:1.5rem; margin:10px 0 14px; }
.menu-card-copy a{
  font-size:.68rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted);
  display:inline-flex; align-items:center; gap:8px; border-bottom:1px solid transparent; transition:.3s;
}
.menu-card:hover .menu-card-copy a{ color:var(--gold-bright); border-color:var(--gold-bright); }

.menu-links-extra{
  margin-top:56px; display:flex; flex-wrap:wrap; gap:14px;
}
.menu-links-extra a{
  border:1px solid var(--hair); padding:14px 22px; font-size:.7rem; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); transition:.3s;
}
.menu-links-extra a:hover{ border-color:var(--gold); color:var(--gold-bright); }

/* ============ RESERVE CTA ============ */
.reserve{
  position:relative; padding:150px 0; text-align:center; overflow:hidden;
}
.reserve-bg{ position:absolute; inset:0; }
.reserve-bg img{ width:100%; height:100%; object-fit:cover; filter:brightness(.4) saturate(.9); }
.reserve-bg::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg, var(--ink), rgba(10,9,8,.55) 40%, var(--ink)); }
.reserve-inner{ position:relative; z-index:2; }
.reserve .eyebrow{ justify-content:center; }
.reserve h2{ font-size:clamp(2.4rem,5vw,4rem); margin:20px auto 18px; max-width:700px; }
.reserve p{ color:var(--muted); max-width:480px; margin:0 auto 36px; }

/* ============ HOURS / INFO STRIP ============ */
.info-strip{ background:var(--panel); }
.info-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:60px; }
.info-col h3{ font-size:1.2rem; margin-bottom:22px; color:var(--gold-bright); }
.hours-row{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--hair); font-size:.9rem; color:var(--muted); }
.hours-row span:last-child{ color:var(--ivory); }
.info-col p{ color:var(--muted); font-size:.95rem; margin-bottom:10px; }
.info-col a.contact-link{ color:var(--ivory); font-size:1rem; display:block; margin-bottom:6px; transition:.3s; }
.info-col a.contact-link:hover{ color:var(--gold-bright); }

/* ============ FOOTER ============ */
footer{ background:var(--ink); border-top:1px solid var(--hair); padding:70px 0 30px; }
.footer-top{ display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:40px; padding-bottom:50px; border-bottom:1px solid var(--hair); }
.footer-brand .mark{ font-family:var(--display); font-size:1.3rem; letter-spacing:.3em; text-transform:uppercase; }
.footer-brand p{ color:var(--muted); margin-top:16px; max-width:280px; font-size:.9rem; }
.footer-col h4{ font-size:.72rem; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); margin-bottom:22px; }
.footer-col ul li{ margin-bottom:12px; }
.footer-col ul a{ color:var(--muted); font-size:.9rem; transition:.3s; }
.footer-col ul a:hover{ color:var(--gold-bright); }
.footer-bottom{ display:flex; justify-content:space-between; align-items:center; padding-top:26px; font-size:.75rem; color:var(--muted); flex-wrap:wrap; gap:14px; }
.footer-social{ display:flex; gap:16px; }
.footer-social a{ width:36px; height:36px; border:1px solid var(--hair); display:flex; align-items:center; justify-content:center; transition:.3s; }
.footer-social a:hover{ border-color:var(--gold); color:var(--gold-bright); }
.footer-social svg{ width:14px; height:14px; }

/* ============ LANDING CHOOSER ============ */
body.landing{ min-height:100vh; overflow-y:auto; }
.chooser{ min-height:100vh; display:flex; position:relative; }
.chooser-side{
  position:relative; flex:1; overflow:hidden; display:flex; align-items:flex-end; justify-content:center;
  cursor:pointer; transition:flex 0.7s var(--ease);
}
.chooser-side img{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  transform:scale(1.06); transition:transform 1.1s var(--ease), filter 1.1s var(--ease);
  filter:brightness(.62) saturate(.95);
}
.chooser-side.asia-side img{ object-position: 75% 25%; }
.chooser-side::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(0deg, rgba(5,5,5,.68), rgba(5,5,5,.12) 55%, rgba(5,5,5,.22));
  transition:background .6s;
}
.chooser-side:hover img{ transform:scale(1); filter:brightness(.78) saturate(1.05); }
.chooser-side.dim{ flex:1; }
.chooser-side.dim img{ filter:brightness(.32) saturate(.65) grayscale(.25); transform:scale(1.06); }
.chooser-side.dim::after{ background:linear-gradient(0deg, rgba(5,5,5,.92), rgba(5,5,5,.55) 55%, rgba(5,5,5,.65)); }
.chooser-copy{ position:relative; z-index:2; padding:0 30px 60px; text-align:center; }
.chooser-copy h2{ font-size:clamp(2rem,4.4vw,3.2rem); color:#f3ecdf; margin:0 0 28px; display:block; }
.chooser-cta{
  margin-top:0; display:inline-flex; align-items:center; gap:10px;
  background:rgba(8,8,11,.72); backdrop-filter:blur(4px);
  border:1px solid rgba(243,236,223,.55); color:#f3ecdf; padding:14px 28px;
  font-size:.68rem; letter-spacing:.22em; text-transform:uppercase; transition:.4s; white-space:nowrap;
  animation:ctaPulse 2.8s ease-in-out infinite;
}
@keyframes ctaPulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(243,236,223,0); }
  50%{ box-shadow:0 0 0 8px rgba(243,236,223,0.06); }
}
.chooser-side:hover .chooser-cta{ transform:scale(1.05); animation-play-state:paused; }
.chooser-cta svg{ transition:transform .4s var(--ease); }
.chooser-side:hover .chooser-cta svg{ transform:translateX(4px); }
.chooser-side.asia-side .chooser-cta:hover{ background:#c6a15b; border-color:#c6a15b; color:#0a0908; }
.chooser-side.fusion-side .chooser-cta:hover{ background:#c98a4b; border-color:#c98a4b; color:#0a0908; }
.chooser-divider{
  flex:0 0 1px; align-self:stretch; background:rgba(243,236,223,.18); z-index:4; position:relative;
}
@media (max-width:820px){
  body.landing{ overflow-y:auto; height:auto; min-height:100vh; }
  .chooser{ flex-direction:column; height:auto; min-height:100vh; }
  .chooser-side{ min-height:50vh; flex:none; }
  .chooser-side.dim{ flex:none; min-height:44vh; }
  .chooser-divider{ display:none; }
  .chooser-copy{ padding:0 20px 40px; }
  .chooser-cta{ padding:12px 22px; font-size:.62rem; }
}

/* ============ LIVE INTERACTIVE MENU ============ */
.live-menu{ position:relative; background-color:var(--panel-2); overflow:hidden; }
.live-menu-bg{
  position:absolute; top:0; left:0; width:100%; height:560px; z-index:0;
  background-image:url('images/menu-bg.webp');
  background-size:cover; background-position:top center; background-repeat:no-repeat;
}
.live-menu-bg::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(8,8,11,.5) 0%, rgba(8,8,11,.85) 65%, var(--panel-2) 100%);
}
.live-menu > .container{ position:relative; z-index:1; }
@media (max-width:600px){
  .live-menu-bg{ height:360px; }
}
.menu-toolbar{
  display:flex; gap:18px; flex-wrap:wrap; align-items:center; justify-content:space-between;
  margin-bottom:28px;
}
.menu-search{ position:relative; flex:1; min-width:220px; max-width:360px; }
.menu-search svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--muted); }
.menu-search input{
  width:100%; background:var(--panel); border:1px solid var(--hair); color:var(--ivory);
  padding:13px 16px 13px 40px; font-family:var(--body-f); font-size:.9rem; outline:none;
  transition:border-color .3s;
}
.menu-search input::placeholder{ color:var(--muted); }
.menu-search input:focus{ border-color:var(--sakura); }
.menu-filters{ display:flex; gap:10px; flex-wrap:wrap; }
.filter-chip{
  background:transparent; border:1px solid var(--hair); color:var(--muted);
  padding:9px 18px; font-size:.68rem; letter-spacing:.14em; text-transform:uppercase;
  border-radius:30px; transition:.3s;
}
.filter-chip:hover{ border-color:var(--sakura); color:var(--ivory); }
.filter-chip.active{ background:var(--sakura); border-color:var(--sakura); color:#fff; }

.menu-tabs-wrap{ position:sticky; top:70px; z-index:20; margin-bottom:10px; }
.menu-tabs{
  position:relative; background:#0c0c10;
  display:flex; gap:8px; overflow-x:auto; padding:16px 4px;
  border-bottom:1px solid var(--hair); box-shadow:0 12px 30px rgba(0,0,0,.6);
  scrollbar-width:none; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}
.menu-tabs::-webkit-scrollbar{ display:none; }
.menu-tabs-wrap::before, .menu-tabs-wrap::after{
  content:''; position:absolute; top:0; bottom:1px; width:36px; z-index:2; pointer-events:none;
}
.menu-tabs-wrap::before{ left:0; background:linear-gradient(90deg, #0c0c10, transparent); }
.menu-tabs-wrap::after{ right:0; background:linear-gradient(270deg, #0c0c10, transparent); }
.tab-btn{
  flex:0 0 auto; background:#17171d; border:1px solid var(--hair); color:#e4e0d8;
  padding:11px 20px; font-size:.7rem; letter-spacing:.12em; text-transform:uppercase;
  white-space:nowrap; transition:.3s; scroll-snap-align:start; font-weight:500;
}
.tab-btn:hover{ color:var(--ivory); border-color:var(--gold); }
.tab-btn.active{ background:var(--gold); border-color:var(--gold); color:var(--ink); font-weight:600; }
.tabs-arrow{
  position:absolute; top:50%; transform:translateY(-50%); z-index:3;
  width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:rgba(12,12,16,.92); border:1px solid var(--hair); color:var(--ivory);
  transition:.3s; cursor:pointer;
}
.tabs-arrow:hover{ border-color:var(--gold); color:var(--gold-bright); background:#151519; }
.tabs-arrow-left{ left:-4px; }
.tabs-arrow-right{ right:-4px; }
.tabs-arrow[disabled]{ opacity:0; pointer-events:none; }
@media (max-width:760px){
  .tabs-arrow{ display:none; }
}
@media (max-width:600px){
  .menu-tabs{ padding:12px 4px; gap:6px; }
  .tab-btn{ padding:9px 15px; font-size:.62rem; }
  .menu-tabs-wrap::before, .menu-tabs-wrap::after{ width:22px; }
}

.menu-category-block{ padding-top:36px; }
.menu-category-block:first-child{ padding-top:8px; }
.menu-category-head{ display:flex; align-items:baseline; gap:16px; margin-bottom:6px; }
.menu-category-head h3{ font-size:1.5rem; color:var(--gold-bright); }
.menu-category-head span{ font-size:.8rem; color:var(--muted); font-style:italic; }

.menu-items-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:2px 40px;
}
.menu-item{
  padding:20px 0; border-bottom:1px dashed var(--hair);
  display:flex; flex-direction:column; gap:6px;
}
.menu-item-top{ display:flex; justify-content:space-between; align-items:baseline; gap:14px; }
.menu-item-name{ font-family:var(--display); font-size:1.05rem; color:var(--ivory); }
.menu-item-price{ font-family:var(--body-f); font-weight:500; color:var(--sakura-2); white-space:nowrap; font-size:.95rem; }
.menu-item-desc{ color:var(--muted); font-size:.88rem; line-height:1.55; }
.menu-item-tags{ display:flex; gap:6px; margin-top:2px; }
.tag-pill{
  font-size:.6rem; letter-spacing:.08em; border:1px solid var(--hair); color:var(--gold);
  padding:2px 8px; border-radius:10px;
}
.tag-pill.tag-spicy{ border-color:rgba(239,60,92,.5); color:var(--sakura-2); }
.tag-pill.tag-new{ border-color:var(--gold); background:rgba(212,175,55,.12); color:var(--gold-bright); font-weight:500; }
.menu-empty{ color:var(--muted); text-align:center; padding:60px 0; font-size:.95rem; }

@media (max-width:820px){
  .menu-items-grid{ grid-template-columns:1fr; }
  .menu-tabs-wrap{ top:56px; }
}
/* ============ MENU PAGE HERO ============ */
.menu-page-hero{
  position:relative; min-height:52vh; display:flex; align-items:flex-end;
  overflow:hidden; padding:150px 0 70px;
}
.menu-page-hero .hero-bg img{ object-position:center 40%; }
.menu-page-hero .hero-bg::after{
  background:
    linear-gradient(0deg, var(--ink) 4%, rgba(10,9,8,.55) 45%, rgba(10,9,8,.4) 100%),
    linear-gradient(90deg, rgba(10,9,8,.75) 0%, rgba(10,9,8,.3) 55%, rgba(10,9,8,.55) 100%);
}
.menu-page-hero .container{ position:relative; z-index:2; }
.menu-page-hero-stats{ display:flex; gap:34px; margin-top:26px; flex-wrap:wrap; }
.menu-page-hero-stats div b{ font-family:var(--display); font-size:1.6rem; color:var(--gold-bright); display:block; }
.menu-page-hero-stats div span{ font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
@media (max-width:600px){
  .menu-page-hero{ min-height:auto; padding:120px 0 50px; }
}

@media (max-width:1080px){
  .about-grid{ grid-template-columns:1fr; }
  .about-media img{ height:400px; }
  .menu-grid{ grid-template-columns:repeat(2,1fr); }
  .footer-top{ grid-template-columns:1fr 1fr; }
  .info-grid{ grid-template-columns:1fr; gap:34px; }
}
@media (max-width:760px){
  .nav-links, .nav-cta .btn{ display:none; }
  .nav-burger{ display:flex; }
  .menu-grid{ grid-template-columns:1fr; }
  .footer-top{ grid-template-columns:1fr; }
  section{ padding:70px 0; }
  .site-nav{ padding:18px 20px; }
  .site-nav.scrolled{ padding:12px 20px; }

  .about-media .tag{
    position:static; margin-top:18px; max-width:none; box-shadow:none;
  }
  .about-media img{ height:340px; }
  .stat-row{ flex-wrap:wrap; gap:26px 40px; }

  .specials-slider{ aspect-ratio:auto; min-height:480px; max-height:560px; }
  .special-copy{ padding:40px 0 130px; }
  .specials-tabs{ left:20px; bottom:22px; }
  .specials-nav{ right:20px; bottom:22px; gap:8px; }
  .specials-nav button{ width:38px; height:38px; }

  .reserve{ padding:100px 0; }
}
@media (max-width:480px){
  .container{ padding:0 20px; }
  .hero-actions{ flex-direction:column; align-items:stretch; }
  .hero-actions .btn{ justify-content:center; }
  .specials-slider{ min-height:440px; }
  .special-copy h3{ font-size:1.8rem; }
  .special-copy p{ font-size:.9rem; }
}

<style>
  /* page-only additions */
  .asia-pattern-overlay{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background: radial-gradient(circle at 25% 65%, rgba(200,30,58,.28), transparent 60%);
  }
  .fusion-side img{ object-position: 8% 50%; }

  .lantern{
    position:absolute; top:-14px; z-index:3; width:60px; pointer-events:none;
    transform-origin:top center; animation:lanternSwing 4.5s ease-in-out infinite;
    filter:drop-shadow(0 8px 18px rgba(200,30,58,.45));
  }
  .lantern.left{ left:36px; }
  .lantern.right{ right:36px; animation-delay:1.2s; }
  @keyframes lanternSwing{
    0%,100%{ transform:rotate(-4deg); }
    50%{ transform:rotate(4deg); }
  }
  @media (max-width:820px){
    .lantern{ width:42px; top:-10px; }
    .lantern.left{ left:18px; }
    .lantern.right{ right:18px; }
  }
  @media (prefers-reduced-motion: reduce){
    .lantern{ animation:none; }
  }
  @media (max-width:480px){
    #asiaLogoMark{ width:150px !important; height:52px !important; background-size:150px 52px !important; margin:0 auto 20px auto !important; }
    #fusionLogoMark{ width:155px !important; height:52px !important; background-size:155px 52px !important; margin:0 auto 20px auto !important; }
  }

  .page-transition{
    position:fixed; inset:0; z-index:999; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
  }
  .page-transition-circle{
    position:fixed; width:40px; height:40px; border-radius:50%;
    background:radial-gradient(circle, #e83a52 0%, #8a1522 55%, #08080b 100%);
    transform:translate(-50%,-50%) scale(0);
    transition:transform .8s cubic-bezier(.62,.04,.32,1);
    left:var(--tx,50%); top:var(--ty,50%);
  }
  .page-transition-circle.active{ transform:translate(-50%,-50%) scale(90); }
  .page-transition-mark{
    position:fixed; left:var(--tx,50%); top:var(--ty,50%); transform:translate(-50%,-50%);
    opacity:0; transition:opacity .5s ease .35s;
    font-family:'Shippori Mincho', serif; color:#f5f1e8; letter-spacing:.3em;
    text-transform:uppercase; font-size:.75rem; white-space:nowrap;
  }
  .page-transition-mark.active{ opacity:1; }
</style>

  <script>
    // widen the hovered side, dim the other — desktop only
    const sides = document.querySelectorAll('.chooser-side');
    if (window.matchMedia('(min-width:821px)').matches) {
      sides.forEach(side => {
        side.addEventListener('mouseenter', () => {
          sides.forEach(s => s.classList.toggle('dim', s !== side));
        });
        side.addEventListener('mouseleave', () => {
          sides.forEach(s => s.classList.remove('dim'));
        });
      });
    }

    // Geisha-style iris wipe transition on entering a restaurant
    const circle = document.getElementById('transitionCircle');
    const mark = document.getElementById('transitionMark');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    sides.forEach(side => {
      side.addEventListener('click', (e) => {
        const dest = side.getAttribute('href');
        if (!dest) return;
        if (reduceMotion) return; // let the link navigate normally

        e.preventDefault();
        const label = side.classList.contains('asia-side') ? 'Entering Geisha Asia' : 'Entering Geisha Fusion';
        const x = e.clientX || (side.getBoundingClientRect().left + side.getBoundingClientRect().width / 2);
        const y = e.clientY || (side.getBoundingClientRect().top + side.getBoundingClientRect().height / 2);

        document.documentElement.style.setProperty('--tx', x + 'px');
        document.documentElement.style.setProperty('--ty', y + 'px');
        mark.textContent = label;

        requestAnimationFrame(() => {
          circle.classList.add('active');
          mark.classList.add('active');
        });

        setTimeout(() => { window.location.href = dest; }, 780);
      });
    });
  </script>

// ============ NAV SCROLL STATE (all views) ============
document.querySelectorAll('.site-nav').forEach(nav => {
  const onScroll = () => {
    if (window.scrollY > 40) nav.classList.add('scrolled');
    else nav.classList.remove('scrolled');
  };
  document.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
});

// ============ MOBILE MENU (paired per view) ============
document.querySelectorAll('.nav-burger').forEach(burger => {
  const nav = burger.closest('nav');
  const panel = (nav && nav.nextElementSibling && nav.nextElementSibling.classList.contains('mobile-panel'))
    ? nav.nextElementSibling
    : null;
  if (!panel) return;
  burger.addEventListener('click', () => panel.classList.toggle('open'));
  panel.querySelectorAll('a').forEach(a => a.addEventListener('click', () => panel.classList.remove('open')));
});

// ============ SCROLL REVEAL ============
const revealEls = document.querySelectorAll('.reveal');
if (revealEls.length) {
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('in');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.15 });
  revealEls.forEach((el, i) => {
    el.style.transitionDelay = (i % 4) * 0.08 + 's';
    io.observe(el);
  });
}

// ============ SPECIALS CAROUSEL (one per view that has one) ============
document.querySelectorAll('.specials-slider').forEach(slider => {
  const slides = slider.querySelectorAll('.special-slide');
  const tabs = slider.parentElement.querySelectorAll('.specials-tabs button');
  const prevBtn = slider.parentElement.querySelector('.spec-prev');
  const nextBtn = slider.parentElement.querySelector('.spec-next');
  let idx = 0;
  let timer;

  function go(n) {
    slides[idx].classList.remove('active');
    tabs[idx] && tabs[idx].classList.remove('active');
    idx = (n + slides.length) % slides.length;
    slides[idx].classList.add('active');
    tabs[idx] && tabs[idx].classList.add('active');
  }
  function auto() {
    clearInterval(timer);
    timer = setInterval(() => go(idx + 1), 6500);
  }
  tabs.forEach((t, i) => t.addEventListener('click', () => { go(i); auto(); }));
  prevBtn && prevBtn.addEventListener('click', () => { go(idx - 1); auto(); });
  nextBtn && nextBtn.addEventListener('click', () => { go(idx + 1); auto(); });
  auto();
});

// ============ FALLING PETAL / GOLD-DUST CANVAS ============
(function () {
  const canvas = document.getElementById('petal-canvas');
  if (!canvas) return;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) return;
  const ctx = canvas.getContext('2d');
  let w, h, particles;
  const goldColors = ['#c6a15b', '#e9cf8e', '#7d2634'];
  const fusionColors = ['#c98a4b', '#e8ab6b', '#5a9184'];
  function currentColors() {
    return (window.__activeView === 'fusion') ? fusionColors : goldColors;
  }

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  function makeParticles(n) {
    particles = Array.from({ length: n }).map(() => ({
      x: Math.random() * w,
      y: Math.random() * h - h,
      r: 2 + Math.random() * 3.5,
      speed: 0.35 + Math.random() * 0.7,
      drift: (Math.random() - 0.5) * 0.6,
      angle: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.02,
      color: currentColors()[Math.floor(Math.random() * 3)],
      opacity: 0.25 + Math.random() * 0.5
    }));
  }
  resize();
  makeParticles(Math.min(38, Math.floor(w / 42)));
  window.addEventListener('resize', () => { resize(); });

  function drawPetal(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.globalAlpha = p.opacity;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.r, p.r * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  function tick() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.y += p.speed;
      p.x += p.drift;
      p.angle += p.spin;
      if (p.y > h + 20) {
        p.y = -20; p.x = Math.random() * w;
        p.color = currentColors()[Math.floor(Math.random() * 3)];
      }
      drawPetal(p);
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

// ============ HERO MOON PARALLAX ============
(function () {
  const moon = document.querySelector('.hero-moon');
  if (!moon) return;
  window.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 24;
    const y = (e.clientY / window.innerHeight - 0.5) * 24;
    moon.style.transform = `translate(${x}px, ${y}px)`;
  });
})();

// ============ VIEW ROUTER (single-page app navigation) ============
(function () {
  const VIEWS = ['chooser', 'asia', 'menu', 'fusion'];
  window.__activeView = 'chooser';

  window.showView = function (view, anchorId, category) {
    if (VIEWS.indexOf(view) === -1) return;
    VIEWS.forEach(v => {
      const el = document.getElementById('view-' + v);
      if (el) el.style.display = (v === view) ? '' : 'none';
    });
    window.__activeView = view;
    document.querySelectorAll('.mobile-panel.open').forEach(p => p.classList.remove('open'));

    const titles = {
      chooser: 'Geisha Restaurants | Newcastle Upon Tyne',
      asia: 'Geisha Asia | Pan-Asian Restaurant in Benton, Newcastle Upon Tyne',
      menu: 'Full Menu | Geisha Asia',
      fusion: 'Geisha Fusion | Global Fusion Restaurant in Benton, Newcastle Upon Tyne'
    };
    if (titles[view]) document.title = titles[view];

    if (category && window.__setMenuCategory) {
      window.__setMenuCategory(category);
    }

    if (anchorId) {
      requestAnimationFrame(() => {
        const el = document.getElementById(anchorId);
        if (el) el.scrollIntoView({ behavior: 'auto', block: 'start' });
      });
    } else {
      window.scrollTo(0, 0);
    }

    // Immediately reveal content in the newly-shown view (it may have been
    // hidden while the IntersectionObserver tried to observe it earlier)
    requestAnimationFrame(() => {
      const activeEl = document.getElementById('view-' + view);
      if (activeEl) {
        activeEl.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
      }
    });

    try {
      history.replaceState(null, '', '#/' + view + (anchorId ? '/' + anchorId : ''));
    } catch (err) {
      // Sandboxed preview environments (e.g. srcdoc iframes) block history
      // updates entirely — that's fine, the view has already switched above,
      // we just silently skip updating the visible URL.
    }
  };

  document.addEventListener('click', (e) => {
    const link = e.target.closest('[data-view]');
    if (!link) return;
    e.preventDefault();
    window.showView(link.dataset.view, link.dataset.anchor, link.dataset.category);
  });

  // Deep link support on load: #/asia, #/menu/dimsum, etc.
  function routeFromHash() {
    const hash = window.location.hash.replace(/^#\/?/, '');
    if (!hash) { window.showView('chooser'); return; }
    const parts = hash.split('/');
    const view = parts[0];
    const rest = parts[1];
    if (view === 'menu' && rest) {
      window.showView('menu', null, rest);
    } else if (VIEWS.indexOf(view) !== -1) {
      window.showView(view, rest || null);
    } else {
      window.showView('chooser');
    }
  }
  window.__routeFromHash = routeFromHash;
})();

    return str.replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
  }

  function itemMatches(item, query, diet) {
    const matchesDiet = diet === 'all' || (item.tags && item.tags.includes(diet));
    const haystack = (item.name + ' ' + item.desc).toLowerCase();
    const matchesQuery = !query || haystack.includes(query);
    return matchesDiet && matchesQuery;
  }

      html += `<div class="menu-category-block">
        <div class="menu-category-head"><h3>${cat.name}</h3>${cat.note ? `<span>${escapeHtml(cat.note)}</span>` : ''}</div>

            </div>
          `).join('')}
        </div>
      </div>`;
    });

    itemsEl.innerHTML = html;
    emptyEl.hidden = any;
  }

    activeDiet = btn.dataset.diet;
    filtersEl.querySelectorAll('.filter-chip').forEach(b => b.classList.toggle('active', b === btn));
    render();
  });

  searchEl.addEventListener('input', render);

  // Callable by the view router (window.showView) to jump to a category
  window.__setMenuCategory = function (categoryId) {
    if (!MENU.some(c => c.id === categoryId)) return;
    activeTab = categoryId;
    searchEl.value = '';
    tabsEl.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === categoryId));

  };

  // Slider arrows for the category tabs
  const arrowLeft = document.getElementById('tabsArrowLeft');
  const arrowRight = document.getElementById('tabsArrowRight');
  if (arrowLeft && arrowRight) {
    function updateArrows() {
      const maxScroll = tabsEl.scrollWidth - tabsEl.clientWidth - 2;
      arrowLeft.disabled = tabsEl.scrollLeft <= 2;
      arrowRight.disabled = tabsEl.scrollLeft >= maxScroll;
    }
    arrowLeft.addEventListener('click', () => {
      tabsEl.scrollBy({ left: -220, behavior: 'smooth' });
    });
    arrowRight.addEventListener('click', () => {
      tabsEl.scrollBy({ left: 220, behavior: 'smooth' });
    });
    tabsEl.addEventListener('scroll', updateArrows, { passive: true });
    window.addEventListener('resize', updateArrows);
    setTimeout(updateArrows, 50);
  }
})();
